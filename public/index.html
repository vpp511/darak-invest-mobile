<!DOCTYPE html>
<html>
<head>
  <base href="/darak-invest-mobile/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="دارك وحيك — منصة عقارية ذكية للبيع والإيجار">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="دارك وحيك">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>دارك وحيك — منصة عقارية ذكية</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // يحذف الكاش القديم مرة واحدة فقط
    if ('serviceWorker' in navigator) {
      (async function() {
        try {
          if (!sessionStorage.getItem('darak_purged_final')) {
            sessionStorage.setItem('darak_purged_final', '1');
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            }
            location.reload();
          }
        } catch(e) {}
      })();
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=emerald-live" async></script>
</body>
</html>
